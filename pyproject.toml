[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voucher-pilot"
version = "0.1.0"
description = "A script to generate and test hotspot vouchers."
authors = [
    {name = "Onehand-Coding", email = "onehand.coding433@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium==4.8.3",
    "python-dotenv",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "ruff",
]

[project.scripts]
voucher-pilot = "voucher_pilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voucher_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
